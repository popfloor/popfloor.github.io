<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Music Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #181818;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .player {
      width: min(90vw, 520px);
      background: #242424;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.3rem;
      font-weight: 600;
    }

    #now-playing {
      margin-bottom: 12px;
      color: #bbb;
      font-size: 0.95rem;
    }

    audio {
      width: 100%;
      margin-bottom: 20px;
    }

    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .playlist li {
      padding: 11px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .playlist li:hover {
      background: #333;
    }

    .playlist li.active {
      background: #3a3a3a;
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="player">
  <h1>Sixtynine and The Continuous People</h1>

  <div id="now-playing">Select a track</div>

  <audio id="audio" controls></audio>

  <ul class="playlist" id="playlist">
    <li data-src="01_I_Cant_Hear_You_Any_More.mp3">
      01. I Can't Hear You Any More
    </li>

    <li data-src="02_Shadows_That_Haunt_Me.mp3">
      02. Shadows That Haunt Me
    </li>

    <li data-src="03_The_Girl_Who_Had_Everything.mp3">
      03. The Girl Who Had Everything
    </li>

    <li data-src="04_Sadness_In_Disguise.mp3">
      04. Sadness In Disguise
    </li>

    <li data-src="05_Vegetable_Man.mp3">
      05. Vegetable Man
    </li>

    <li data-src="06_I_Know_Where_Syd_Barrett_Lives.mp3">
      06. I Know Where Syd Barrett Lives
    </li>
  </ul>
</div>

<script>
  const audio = document.getElementById("audio");
  const playlist = [...document.querySelectorAll("#playlist li")];
  const nowPlaying = document.getElementById("now-playing");

  let currentTrack = 0;

  function playTrack(index) {
    currentTrack = index;

    const item = playlist[index];

    audio.src = item.dataset.src;
    nowPlaying.textContent = item.textContent.trim();

    playlist.forEach(track => track.classList.remove("active"));
    item.classList.add("active");

    audio.play();
  }

  playlist.forEach((item, index) => {
    item.addEventListener("click", () => playTrack(index));
  });

  audio.addEventListener("ended", () => {
    const next = currentTrack + 1;

    if (next < playlist.length) {
      playTrack(next);
    }
  });
</script>

</body>
</html>
